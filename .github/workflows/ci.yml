# .github/workflows/ci.yml
name: CI

on:
  push:
    branches:
      - main
      - 'analysis/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'experiment/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

#concurrency:
#  group: ci-${{ github.ref }}
#  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies from the lockfile
        run: |
          uv python install 3.14
          uv sync --locked --all-groups

      - name: Ruff linting and security checks
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Docstring presence (modules, classes, functions)
        run: uv run interrogate -c pyproject.toml src

      - name: Unit tests and coverage gate (>= 90%)
        run: uv run pytest --tb=short -q --cov=src/railinsight --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Dependency vulnerability audit
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip

      - name: Build documentation (warnings are errors)
        run: uv run sphinx-build -W -b html docs/source docs/build/html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    needs: quality
    runs-on: ubuntu-latest
    #if: github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom d'image en minuscules
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            >> $GITHUB_OUTPUT

      - name: Connexion au registre GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Construction et push de l'image
        run: |
          IMAGE=${{ steps.image.outputs.name }}
          docker build -t ${IMAGE}:latest -t ${IMAGE}:${{ github.sha }} .
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    #if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configuration de l'agent SSH
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-keyscan ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"

      - name: Copie du docker-compose vers le serveur
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.yml \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_DIR }}/docker-compose.yml

      - name: Déploiement du conteneur
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            "cd ${{ secrets.REMOTE_DIR }} && \
             echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USER }}' --password-stdin && \
             docker compose down && \
             docker rmi -f ${IMAGE}:latest 2>/dev/null || true && \
             docker pull ${IMAGE}:latest && \
             RAILINSIGHT_IMAGE=${IMAGE}:latest docker compose up -d"
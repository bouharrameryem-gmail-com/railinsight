# .github/workflows/ci.yml
name: CI

on:
  push:
    branches:
      - main
      - 'analysis/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'experiment/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

#concurrency:
#  group: ci-${{ github.ref }}
#  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies from the lockfile
        run: |
          uv python install 3.14
          uv sync --locked --all-groups

#      - name: PEP 8, docstring style and security rules
      - name: Ruff linting and security checks
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

#      - name: Docstring presence (modules, classes, functions)
#        run: uv run interrogate -c pyproject.toml src

#      - name: Unit tests and coverage (>= 90%)
#        run: uv run pytest --cov=railinsight --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Dependency vulnerability audit
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

#      - name: Build documentation (warnings are errors)
#        run: uv run sphinx-build -W -b html docs/source docs/build/html

#      - name: Upload coverage report
#        uses: actions/upload-artifact@v4
#        with:
#          name: coverage-xml
#          path: coverage.xml